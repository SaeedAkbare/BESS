# دریافت قیمت‌های تاریخیِ واقعی برای آموزش و ارزیابی BESS.
name: Download DE-LU price history

# وقتی این Workflow ساخته/ویرایش شود یک بار اجرا می‌شود.
on:
  push:
    paths:
      - ".github/workflows/fetch_history.yml"
      - "history.py"
  workflow_dispatch:

# فقط خواندن مخزن؛ هیچ فایل داده‌ای خودکار کامیت نمی‌شود.
permissions:
  contents: read

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      # دریافت فایل‌های برنامه.
      - name: Checkout code
        uses: actions/checkout@v4

      # نصب پایتون.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # نصب کتابخانه‌های موردنیاز.
      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      # تست تغییر ساعت و خطاهای داده قبل از دریافت واقعی.
      - name: Test validation
        run: python -m unittest -v test_data

      # دانلود ماه‌به‌ماه؛ هر ماهِ ناقص باعث توقف کل مرحله می‌شود.
      - name: Fetch historical prices
        run: python history.py

      # حتی اگر ماه بعدی با خطا متوقف شود، ماه‌های معتبر قبلی حفظ می‌شوند.
      - name: Save validated CSV files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DE-LU-validated-months
          path: output/
          if-no-files-found: warn
