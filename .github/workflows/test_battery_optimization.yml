name: Test battery optimization MILP

on:
  push:
    branches:
      - feature/battery-optimization-foundation
  pull_request:
    paths:
      - battery_optimization.py
      - tests/test_battery_optimization.py
      - tests/test_battery_comparison.py
      - tests/test_battery_physics_audit.py
      - battery_comparison.py
      - battery_chronological_holdout.py
      - tests/test_battery_chronological_holdout.py
      - battery_walk_forward.py
      - tests/test_battery_walk_forward.py
      - battery_monthly_scenarios.py
      - tests/test_battery_monthly_scenarios.py
      - extend_price_history.py
      - tests/test_extend_price_history.py
      - run_battery_walk_forward.py
      - tests/test_run_battery_walk_forward.py
      - battery_uncertainty.py
      - tests/test_battery_uncertainty.py
      - battery_scenario_diagnostics.py
      - tests/test_battery_scenario_diagnostics.py
      - .github/workflows/test_battery_optimization.yml
  workflow_dispatch:

jobs:
  battery-milp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install MILP dependencies
        run: python -m pip install numpy pandas pyomo highspy scikit-learn requests
      - name: Run solver-backed and chronological holdout tests
        run: python -m unittest -v tests.test_battery_optimization tests.test_battery_comparison tests.test_battery_physics_audit tests.test_battery_chronological_holdout tests.test_battery_walk_forward tests.test_battery_monthly_scenarios tests.test_extend_price_history tests.test_run_battery_walk_forward tests.test_battery_uncertainty tests.test_battery_scenario_diagnostics
