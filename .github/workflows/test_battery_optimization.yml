name: Test battery optimization MILP

on:
  push:
    branches:
      - feature/battery-optimization-foundation
  pull_request:
    paths:
      - battery_optimization.py
      - test_battery_optimization.py
      - test_battery_comparison.py
      - test_battery_physics_audit.py
      - battery_comparison.py
      - .github/workflows/test_battery_optimization.yml
  workflow_dispatch:

jobs:
  battery-milp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install MILP dependencies
        run: python -m pip install numpy pandas pyomo highspy
      - name: Run solver-backed synthetic and physics audit tests
        run: python -m unittest -v test_battery_optimization test_battery_comparison test_battery_physics_audit
